<!DOCTYPE html>
<html>

<head>
    <title>Happy Birthday</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating balloons -->
    <div class="background-balloon" style="left:10%; animation-delay:0s;">🎈</div>
    <div class="background-balloon" style="left:30%; animation-delay:2s;">🎈</div>
    <div class="background-balloon" style="left:50%; animation-delay:4s;">🎈</div>
    <div class="background-balloon" style="left:70%; animation-delay:1s;">🎈</div>
    <div class="background-balloon" style="left:90%; animation-delay:3s;">🎈</div>

    <!-- Main balloon -->
    <div class="balloon" id="balloon">🎈</div>

    <div class="hint" id="hint">
        click the balloon 🎈
    </div>

    <!-- Hidden photo -->
    <img src="her.jpeg" id="photo" class="photo">


    <!-- Hidden message -->
    <div class="message" id="message">
        <div class="to-line">To Reven,</div>
        愿你平安无疾，远离烦恼与小人。<br>
        永远开开心心，被世界温柔以待。<br>
        生日快乐 🎂
    </div>
    <br><br>

    <a href="spinner.html" class="reward-button" id="rewardButton">
        Claim your birthday reward 🎁
    </a>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <audio id="popSound" preload="auto">
        <source src="pop.mp3" type="audio/mpeg">
    </audio>

    <audio id="bgMusic" loop preload="auto">
        <source src="Piano.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>

</html>
